name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('devenv.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: nix profile add "github:nixos/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev devenv.lock)#devenv"
      - run: devenv shell -- npm ci
      - run: devenv shell -- npm audit signatures
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: devenv shell -- gitlint --commits "$FROM..$TO"
      - run: devenv test
      # Only the fast checks: the mutation tests and the end-to-end tests take too long on GitHub's
      # runners. The end-to-end tests also fail on Linux for now: the greeting screen's button never
      # shows up.
      - run: devenv shell -- npm run check:fast
